name: Compilar APK de Android

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código
      uses: actions/checkout@v4

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Dar permisos de ejecución a Gradle
      run: chmod +x gradlew
      working-directory: tubus-android # <-- Reemplaza con el nombre de tu carpeta

    - name: Compilar APK (Debug)
      run: ./gradlew assembleDebug
      working-directory: tubus-android # <-- Reemplaza con el nombre de tu carpeta

    - name: Guardar APK como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: tubus-android/app/build/outputs/apk/debug/app-debug.apk # <-- También ponlo aquí al inicio de la ruta

